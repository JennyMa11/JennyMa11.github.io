<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 348" width="876" height="348"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="876" height="348" fill="#FFFFFF"/><text x="24.0" y="26.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="700" text-anchor="start" >CUDA Graph：把 Kernel 序列捕获成一张图，一次提交</text><text x="24.0" y="56.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#DC2626" font-weight="700" text-anchor="start" >普通执行：每步都要逐个 launch Kernel</text><rect x="24.0" y="68.0" width="92.0" height="30.0" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" /><text x="70.0" y="88.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle" >launch k1</text><line x1="116.0" y1="83.0" x2="140.0" y2="83.0" stroke="#DC2626" stroke-width="1.4" marker-end="url(#ah)"/><rect x="142.0" y="68.0" width="92.0" height="30.0" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" /><text x="188.0" y="88.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle" >launch k2</text><line x1="234.0" y1="83.0" x2="258.0" y2="83.0" stroke="#DC2626" stroke-width="1.4" marker-end="url(#ah)"/><rect x="260.0" y="68.0" width="92.0" height="30.0" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" /><text x="306.0" y="88.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle" >launch k3</text><line x1="352.0" y1="83.0" x2="376.0" y2="83.0" stroke="#DC2626" stroke-width="1.4" marker-end="url(#ah)"/><rect x="378.0" y="68.0" width="92.0" height="30.0" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" /><text x="424.0" y="88.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle" >launch k4</text><line x1="470.0" y1="83.0" x2="494.0" y2="83.0" stroke="#DC2626" stroke-width="1.4" marker-end="url(#ah)"/><rect x="496.0" y="68.0" width="92.0" height="30.0" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" /><text x="542.0" y="88.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="600" text-anchor="middle" >launch k5</text><text x="24.0" y="118.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" >CPU 逐个提交 → Driver 调用 + Kernel Launch 固定开销反复发生；GPU 可能在等 CPU 提交</text><text x="24.0" y="152.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#059669" font-weight="700" text-anchor="start" >CUDA Graph：一次 Capture，之后 Replay 整张图</text><rect x="24.0" y="164.0" width="92.0" height="30.0" rx="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.3" /><text x="70.0" y="184.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#059669" font-weight="700" text-anchor="middle" >提交 Graph</text><line x1="116.0" y1="179.0" x2="146.0" y2="179.0" stroke="#059669" stroke-width="1.7" marker-end="url(#ah)"/><rect x="150.0" y="164.0" width="92.0" height="30.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="196.0" y="184.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="600" text-anchor="middle" >k1</text><line x1="242.0" y1="179.0" x2="252.0" y2="179.0" stroke="#0D9488" stroke-width="1.4" marker-end="url(#ah)"/><rect x="254.0" y="164.0" width="92.0" height="30.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="300.0" y="184.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="600" text-anchor="middle" >k2</text><line x1="346.0" y1="179.0" x2="356.0" y2="179.0" stroke="#0D9488" stroke-width="1.4" marker-end="url(#ah)"/><rect x="358.0" y="164.0" width="92.0" height="30.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="404.0" y="184.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="600" text-anchor="middle" >k3</text><line x1="450.0" y1="179.0" x2="460.0" y2="179.0" stroke="#0D9488" stroke-width="1.4" marker-end="url(#ah)"/><rect x="462.0" y="164.0" width="92.0" height="30.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="508.0" y="184.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="600" text-anchor="middle" >k4</text><text x="24.0" y="214.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" >一条指令提交整张图 → GPU 连续执行，省掉反复的 CPU 调度与 Driver 调用</text><rect x="24.0" y="244.0" width="828.0" height="40.0" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3" /><text x="438.0" y="269.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#D97706" font-weight="600" text-anchor="middle" >代价：Capture 耗时、额外显存（静态 Buffer）、要求 Tensor Shape 与显存地址稳定 → 需按 Batch Size 预捕获多套图</text><rect x="24.0" y="292.0" width="828.0" height="40.0" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3" /><text x="438.0" y="317.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2563EB" font-weight="600" text-anchor="middle" >收益与「Launch 开销占比」成正比：Decode 收益大（小 Kernel、重复、图固定）；长 Prefill 收益小（计算本身占主导）</text></svg>