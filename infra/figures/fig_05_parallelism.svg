<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 288" width="876" height="288"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="876" height="288" fill="#FFFFFF"/><text x="24.0" y="26.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="700" text-anchor="start" >并行策略：DP / TP / PP / EP</text><rect x="24.0" y="50.0" width="204.0" height="168.0" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" /><text x="126.0" y="74.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#2563EB" font-weight="700" text-anchor="middle" >DP 数据并行</text><text x="126.0" y="92.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="middle" >模型复制，数据切分</text><text x="126.0" y="118.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="400" text-anchor="middle" >Model×4</text><text x="126.0" y="138.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="400" text-anchor="middle" >数据分成 4 份</text><text x="126.0" y="158.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="400" text-anchor="middle" >通信：All-Reduce</text><line x1="40.0" y1="180.0" x2="212.0" y2="180.0" stroke="#CBD5E1" stroke-width="1"/><text x="126.0" y="200.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#2563EB" font-weight="600" text-anchor="middle" >适用：训练 / 多副本推理</text><rect x="240.0" y="50.0" width="204.0" height="168.0" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" /><text x="342.0" y="74.0" font-fam