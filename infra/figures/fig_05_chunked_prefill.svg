<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 312" width="876" height="312"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="876" height="312" fill="#FFFFFF"/><text x="24.0" y="26.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="700" text-anchor="start" >Chunked Prefill：长 Prompt 拆块执行，与 Decode 混批</text><text x="24.0" y="56.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#DC2626" font-weight="700" text-anchor="start" >不切分：一次 Prefill 8192 Token</text><rect x="24.0" y="68.0" width="500.0" height="34.0" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3" /><text x="274.0" y="90.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle" >Prefill 8192 Token（耗时极长，占满显存）</text><rect x="540.0" y="68.0" width="96.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/><text x="588.0" y="90.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" >Decode 被卡</text><rect x="646.0" y="68.0" width="96.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/><text x="694.0" y="90.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" >Decode 被卡</text><rect x="752.0" y="68.0" width="96.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3"/><text x="800.0" y="90.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#64748B" font-weight="400" text-anchor="middle" >Decode 被卡</text><text x="24.0" y="128.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" >→ Activation + KV 峰值高易 OOM；这一轮极长，其他请求的 Decode 被卡住，TBT 抖动</text><text x="24.0" y="168.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#059669" font-weight="700" text-anchor="start" >Chunked：拆成 8 个 1024 Token Chunk，与 Decode 混批</text><rect x="24.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="63.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C1</text><rect x="103.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="106.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="145.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C2</text><rect x="185.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="188.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="227.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C3</text><rect x="267.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="270.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="309.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C4</text><rect x="349.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="352.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="391.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C5</text><rect x="431.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="434.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="473.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C6</text><rect x="513.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="516.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="555.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C7</text><rect x="595.0" y="180.0" width="3.0" height="34.0" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="598.0" y="180.0" width="78.0" height="34.0" rx="5" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" /><text x="637.0" y="202.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#0D9488" font-weight="700" text-anchor="middle" >C8</text><text x="24.0" y="236.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#64748B" font-weight="400" text-anchor="start" >→ 每轮和 Decode 混批：显存峰值可控，TBT 平滑</text><rect x="24.0" y="256.0" width="828.0" height="40.0" rx="7" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3" /><text x="438.0" y="281.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#D97706" font-weight="600" text-anchor="middle" >代价：中间 Chunk 的采样结果被丢弃（LM Head 只对每序列最后一个 Token 算 Logits）→ 每轮浪费一个 Token 的采样</text></svg>