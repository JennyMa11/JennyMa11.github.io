<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 250" width="876" height="250"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="876" height="250" fill="#FFFFFF"/><text x="24.0" y="26.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="700" text-anchor="start" >量化的基本流程（对称线性量化）</text><rect x="24.0" y="56.0" width="158.0" height="76.0" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.4" /><text x="103.0" y="84.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#475569" font-weight="700" text-anchor="middle" >原始张量 x</text><text x="103.0" y="106.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="400" text-anchor="middle" >FP16 / BF16</text><line x1="184.0" y1="94.0" x2="198.0" y2="94.0" stroke="#64748B" stroke-width="1.7" marker-end="url(#ah)"/><rect x="200.0" y="56.0" width="158.0" height="76.0" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4" /><text x="279.0" y="84.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#0D9488" font-weight="700" text-anchor="middle" >求 scale</text><text x="279.0" y="106.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="400" text-anchor="middle" >scale = max(|x|)/(2^(b-1)-1)</text><line x1="360.0" y1="94.0" x2="374.0" y2="94.0" stroke="#64748B" stroke-width="1.7" marker-end="url(#ah)"/><rect x="376.0" y="56.0" width="158.0" height="76.0" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.4" /><text x="455.0" y="84.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#0D9488" font-weight="700" text-anchor="middle" >量化 q</text><text x="455.0" y="106.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="400" text-anchor="middle" >q = round(x / scale)</text><line x1="536.0" y1="94.0" x2="550.0" y2="94.0" stroke="#64748B" stroke-width="1.7" marker-end="url(#ah)"/><rect x="552.0" y="56.0" width="158.0" height="76.0" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4" /><text x="631.0" y="84.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#7C3AED" font-weight="700" text-anchor="middle" >低精度存储</text><text x="631.0" y="106.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="400" text-anchor="middle" >INT8 / INT4 / FP8</text><line x1="712.0" y1="94.0" x2="726.0" y2="94.0" stroke="#64748B" stroke-width="1.7" marker-end="url(#ah)"/><rect x="728.0" y="56.0" width="158.0" height="76.0" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4" /><text x="807.0" y="84.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#D97706" font-weight="700" text-anchor="middle" >反量化 x̂</text><text x="807.0" y="106.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="9.8" fill="#0F172A" font-weight="400" text-anchor="middle" >x̂ = q × scale</text><rect x="24.0" y="150.0" width="828.0" height="34.0" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.2" /><text x="438.0" y="172.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#0F172A" font-weight="500" text-anchor="middle" >量化误差 = 半个量化步长（half quantization step）；粒度越细（per-tensor → per-channel → per-token → per-group）精度越好，scale 开销越大</text><rect x="24.0" y="194.0" width="828.0" height="34.0" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2" /><text x="438.0" y="216.0" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#DC2626" font-weight="600" text-anchor="middle" >反量化若未与 Kernel 融合（例如先物化浮点张量再算），会额外产生一次 HBM 读写，吃掉带宽收益</text></svg>