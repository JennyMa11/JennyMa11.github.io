<rect width="960" height="370" rx="20" fill="#f9fcfa" stroke="#dce8e1"/>
<text x="36" y="48" class="heading">评测先固定初态，再检查真实终态</text><text x="36" y="75" class="sub">轨迹解释原因；验收决定是否合格；所有尝试的成本都要计入</text>
