<title id="title">MCP 与 A2A：对端承担什么职责？</title><desc id="desc">两者可组合；工具接口和独立任务主体各有应用层责任</desc>
<style>.heading{font:700 25px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.sub{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#5d756d}.label{font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.detail{font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#48645b}.edge{font:12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#536b63}</style>
<rect width="960" height="410" rx="20" fill="#f9fcfa" stroke="#dce8e1"/>
<text x="36" y="48" class="heading">MCP 与 A2A：对端承担什么职责？</text><text x="36" y="75" class="sub">两者可组合；工具接口和独立任务主体各有应用层责任</text>
<g><rect x="36" y="160" width="200" height="100" rx="16" fill="#e8f0ff" stroke="#4771ba" stroke-width="2"/><text x="56" y="194" class="label">宿主研究应用</text><text x="56" y="221" class="detail">全局目标 · 预算 · 验收</text></g><g><rect x="320" y="105" width="245" height="90" rx="16" fill="#e1f4ee" stroke="#12826e" stroke-width="2"/><text x="340" y="139" class="label">MCP Client → Server</text><text x="340" y="166" class="detail">接入检索工具、资源与提示</text></g><g><rect x="320" y="265" width="245" height="90" rx="16" fill="#f0eafd" stroke="#8260bd" stroke-width="2"/><text x="340" y="299" class="label">A2A Client → Agent</text><text x="340" y="326" class="detail">委派任务并跟踪状态、产物</text></g><g><rect x="650" y="105" width="270" height="90" rx="16" fill="#e1f4ee" stroke="#12826e" stroke-width="2"/><text x="670" y="139" class="label">服务能力</text><text x="670" y="166" class="detail">查询证据；按契约返回结果</text></g><g><rect x="650" y="265" width="270" height="90" rx="16" fill="#fff0df" stroke="#c77732" stroke-width="2"/><text x="670" y="299" class="label">独立任务执行</text><text x="670" y="326" class="detail">自主管理步骤；交付后仍需验收</text></g><path d="M236 185 L278 185 L278 150 L312 150" stroke="#56716a" stroke-width="2.5" fill="none" /><polygon points="312,150 305.2,154.2 305.2,145.8" fill="#56716a"/><text x="248" y="140" class="edge"></text><path d="M236 235 L278 235 L278 310 L312 310" stroke="#56716a" stroke-width="2.5" fill="none" /><polygon points="312,310 305.2,314.2 305.2,305.8" fill="#56716a"/><text x="248" y="299" class="edge"></text><path d="M565 150 L642 150" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="642,150 635.2,154.2 635.2,145.8" fill="#56716a"/><path d="M565 310 L642 310" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="642,310 635.2,314.2 635.2,305.8" fill="#56716a"/>
