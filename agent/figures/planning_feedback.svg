<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">计划如何在反馈中修订</title><desc id="desc">节点有依赖和验收；失败后修改假设，而非重复完成声明</desc>
<style>.heading{font:700 25px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.sub{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#5d756d}.label{font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.detail{font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#48645b}.edge{font:12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#536b63}</style>
<rect width="960" height="370" rx="20" fill="#f9fcfa" stroke="#dce8e1"/>
<text x="36" y="48" class="heading">计划如何在反馈中修订</text><text x="36" y="75" class="sub">节点有依赖和验收；失败后修改假设，而非重复完成声明</text>
<g><rect x="36" y="125" width="190" height="95" rx="16" fill="#e8f0ff" stroke="#4771ba" stroke-width="2"/><text x="56" y="159" class="label">拆分需求</text><text x="56" y="186" class="detail">普通 · 边界 · 会员 · 负数</text></g><g><rect x="268" y="125" width="190" height="95" rx="16" fill="#f0eafd" stroke="#8260bd" stroke-width="2"/><text x="288" y="159" class="label">候选修改</text><text x="288" y="186" class="detail">假设：只改 &gt;= 即可</text></g><g><rect x="500" y="125" width="190" height="95" rx="16" fill="#fff0df" stroke="#c77732" stroke-width="2"/><text x="520" y="159" class="label">环境验证</text><text x="520" y="186" class="detail">会员 / 负数仍失败</text></g><g><rect x="732" y="125" width="190" height="95" rx="16" fill="#e1f4ee" stroke="#12826e" stroke-width="2"/><text x="752" y="159" class="label">更新计划</text><text x="752" y="186" class="detail">补条件与优先顺序</text></g><path d="M226 172 L260 172" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="260,172 253.2,176.2 253.2,167.8" fill="#56716a"/><path d="M458 172 L492 172" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="492,172 485.2,176.2 485.2,167.8" fill="#56716a"/><path d="M690 172 L724 172" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="724,172 717.2,176.2 717.2,167.8" fill="#56716a"/><path d="M825 230 L825 294 L363 294 L363 230" stroke="#56716a" stroke-width="2.5" fill="none" /><polygon points="363,230 367.2,236.8 358.8,236.8" fill="#56716a"/><text x="428" y="281" class="edge">保留已验证事实；新修改使旧验收失效</text>
</svg>