<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-labelledby="title desc">
<title id="title">相同观察，为什么会有不同动作？</title><desc id="desc">当前观察不足以决定停止；内部状态保存已经确认的环境信息</desc>
<style>.heading{font:700 25px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.sub{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#5d756d}.label{font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.detail{font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#48645b}.edge{font:12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#536b63}</style>
<rect width="960" height="365" rx="20" fill="#f9fcfa" stroke="#dce8e1"/>
<text x="36" y="48" class="heading">相同观察，为什么会有不同动作？</text><text x="36" y="75" class="sub">当前观察不足以决定停止；内部状态保存已经确认的环境信息</text>
<g><rect x="38" y="120" width="255" height="90" rx="16" fill="#e8f0ff" stroke="#4771ba" stroke-width="2"/><text x="58" y="154" class="label">观察：当前 B 干净</text><text x="58" y="181" class="detail">两种情形看到同一条信号</text></g><g><rect x="365" y="105" width="270" height="90" rx="16" fill="#e1f4ee" stroke="#12826e" stroke-width="2"/><text x="385" y="139" class="label">状态一：A、B 已检查</text><text x="385" y="166" class="detail">已知两间干净；假设无新增污物</text></g><g><rect x="365" y="235" width="270" height="90" rx="16" fill="#f0eafd" stroke="#8260bd" stroke-width="2"/><text x="385" y="269" class="label">状态二：只检查过 B</text><text x="385" y="296" class="detail">A 尚未确认；不能推断全局完成</text></g><g><rect x="713" y="105" width="205" height="90" rx="16" fill="#e1f4ee" stroke="#12826e" stroke-width="2"/><text x="733" y="139" class="label">动作：停止</text><text x="733" y="166" class="detail">满足目标与停止条件</text></g><g><rect x="713" y="235" width="205" height="90" rx="16" fill="#fff0df" stroke="#c77732" stroke-width="2"/><text x="733" y="269" class="label">动作：去 A 观察</text><text x="733" y="296" class="detail">补充缺失的环境证据</text></g><path d="M293 150 L357 150" stroke="#56716a" stroke-width="2.5" fill="none" /><polygon points="357,150 350.2,154.2 350.2,145.8" fill="#56716a"/><text x="302" y="140" class="edge"></text><path d="M293 178 L330 178 L330 280 L357 280" stroke="#56716a" stroke-width="2.5" fill="none" /><polygon points="357,280 350.2,284.2 350.2,275.8" fill="#56716a"/><text x="300" y="263" class="edge"></text><path d="M635 150 L705 150" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="705,150 698.2,154.2 698.2,145.8" fill="#56716a"/><path d="M635 280 L705 280" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="705,280 698.2,284.2 698.2,275.8" fill="#56716a"/>
</svg>