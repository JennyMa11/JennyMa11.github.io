<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">外部内容可以提供事实，不能授予权限</title><desc id="desc">把内容信任与执行能力分开；不把模型提醒当作完整安全边界</desc>
<style>.heading{font:700 25px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.sub{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#5d756d}.label{font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17302d}.detail{font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#48645b}.edge{font:12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#536b63}</style>
<rect width="960" height="370" rx="20" fill="#f9fcfa" stroke="#dce8e1"/>
<text x="36" y="48" class="heading">外部内容可以提供事实，不能授予权限</text><text x="36" y="75" class="sub">把内容信任与执行能力分开；不把模型提醒当作完整安全边界</text>
<g><rect x="36" y="125" width="190" height="100" rx="16" fill="#fff0df" stroke="#c77732" stroke-width="2"/><text x="56" y="159" class="label">不可信材料</text><text x="56" y="186" class="detail">网页 · 源码 · 工具文本</text></g><g><rect x="268" y="125" width="190" height="100" rx="16" fill="#e8f0ff" stroke="#4771ba" stroke-width="2"/><text x="288" y="159" class="label">任务上下文</text><text x="288" y="186" class="detail">保留来源与数据角色</text></g><g><rect x="500" y="125" width="190" height="100" rx="16" fill="#f0eafd" stroke="#8260bd" stroke-width="2"/><text x="520" y="159" class="label">候选动作</text><text x="520" y="186" class="detail">模型可能受内容影响</text></g><g><rect x="732" y="125" width="190" height="100" rx="16" fill="#e1f4ee" stroke="#12826e" stroke-width="2"/><text x="752" y="159" class="label">运行时控制</text><text x="752" y="186" class="detail">授权 · 审批 · 隔离</text></g><path d="M226 175 L260 175" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="260,175 253.2,179.2 253.2,170.8" fill="#56716a"/><path d="M458 175 L492 175" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="492,175 485.2,179.2 485.2,170.8" fill="#56716a"/><path d="M690 175 L724 175" stroke="#56716a" stroke-width="2.5" fill="none"/><polygon points="724,175 717.2,179.2 717.2,170.8" fill="#56716a"/><text x="480" y="291" class="label" text-anchor="middle">可读取政策 ≠ 可读取凭据 ≠ 可向任意地址外发</text>
</svg>